name = "cfnote"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true    # 发布到 cfnote.<子域>.workers.dev
preview_urls = false  # 不为每个版本生成预览 URL
keep_vars = true      # 部署时保留仪表盘中手工添加的环境变量(否则每次 push 部署会清掉它们)

# 静态资源:非 /api 请求直接由平台服务(免费不限量),未命中路径回退到 SPA 入口
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 定时任务:每月 2 日 02:47 UTC 归档上月用量 + 清理回收站;每 5 分钟扫描到期提醒并推送(见 worker/index.ts scheduled 按 cron 分支)
[triggers]
crons = ["47 2 2 * *", "*/5 * * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "cfnote-db"
# 不写 database_id:部署时按名称自动匹配/创建(一键部署向导中可选择),本地 dev 使用本地 SQLite

[[vectorize]]
binding = "VECTORIZE"
index_name = "cfnote-index"

[ai]
binding = "AI"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "cfnote_usage"

# 附件存储(图片/文件,免费额度 10GB)。
# 注意:R2 需先在 Cloudflare Dashboard 开通(免费,但可能要求验证支付方式),
# 并创建名为 cfnote-files 的桶,否则部署会失败(旧版本继续在线,创建桶后重试部署即可)。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cfnote-files"
